[package]
name = "solana_geyser"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.36.0", features = ["full"] }

# Solana
solana-sdk = "2.2.2"
solana-client = "2.2.7"

# Yellowstone gRPC
yellowstone-grpc-client = "6.0.0"
yellowstone-grpc-proto = { version = "6.0.0", default-features = false, features = [
  "plugin",
] }

# Config and CLI
clap = { version = "4.5.3", features = ["derive"] }
serde = { version = "1.0.196", features = ["derive"] }
serde_yaml = "0.9.31"

# Utilities
anyhow = "1.0.79"
bs58 = "0.5.1"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
futures = "0.3.24"            # Often needed with streams

[features]
# Enable legacy blocking RpcClient helper
sync = []
